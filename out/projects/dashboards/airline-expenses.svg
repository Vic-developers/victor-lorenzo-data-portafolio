<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#f7f7f5"/>
  <text x="600" y="50" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#111" text-anchor="middle">DASHBOARD GASTOS AEROLÍNEAS 2001–2015</text>
  
  <!-- KPI Cards -->
  <g font-family="Inter, sans-serif">
    <rect x="40" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="70" y="115" font-size="11" letter-spacing="1.2" fill="#666">AEROLÍNEAS</text>
    <text x="70" y="155" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#00a6a6">6</text>
    
    <rect x="320" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="350" y="115" font-size="11" letter-spacing="1.2" fill="#666">AÑOS DE DATOS</text>
    <text x="350" y="155" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#111">15</text>
    
    <rect x="600" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="630" y="115" font-size="11" letter-spacing="1.2" fill="#666">GASTOS TOTALES MAX</text>
    <text x="630" y="155" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#111">IBERIA</text>
    
    <rect x="880" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="910" y="115" font-size="11" letter-spacing="1.2" fill="#666">COST BASE MÍNIMO</text>
    <text x="910" y="155" font-family="Space Grotesk" font-size="26" font-weight="700" fill="#00a6a6">RYANAIR</text>
  </g>

  <!-- Fuel vs Total Expenses by Airline -->
  <g font-family="Inter, sans-serif" transform="translate(60, 220)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#111">GASTOS COMBUSTIBLE vs TOTALES POR AEROLÍNEA (MILES)</text>
    <rect x="0" y="20" width="1080" height="220" fill="none" stroke="#d9d9d4"/>
    
    <!-- Stacked bars for each airline -->
    <g transform="translate(80, 60)">
      <text x="0" y="-5" font-size="12" font-weight="600" fill="#111">Iberia</text>
      <rect x="0" y="0" width="120" height="120" fill="#111" opacity="0.3"/>  <!-- Total -->
      <rect x="0" y="85" width="120" height="35" fill="#00a6a6"/>  <!-- Fuel -->
      <text x="60" y="170" font-size="10" fill="#666" text-anchor="middle">Total: 1.14M</text>
    </g>
    
    <g transform="translate(240, 60)">
      <text x="0" y="-5" font-size="12" font-weight="600" fill="#111">Air Europa</text>
      <rect x="0" y="0" width="120" height="90" fill="#111" opacity="0.3"/>
      <rect x="0" y="60" width="120" height="30" fill="#00a6a6"/>
      <text x="60" y="170" font-size="10" fill="#666" text-anchor="middle">Total: 850K</text>
    </g>
    
    <g transform="translate(400, 60)">
      <text x="0" y="-5" font-size="12" font-weight="600" fill="#111">Ryanair</text>
      <rect x="0" y="0" width="120" height="45" fill="#111" opacity="0.3"/>
      <rect x="0" y="35" width="120" height="10" fill="#00a6a6"/>
      <text x="60" y="170" font-size="10" fill="#666" text-anchor="middle">Total: 420K</text>
    </g>
    
    <g transform="translate(560, 60)">
      <text x="0" y="-5" font-size="12" font-weight="600" fill="#111">Easyjet</text>
      <rect x="0" y="0" width="120" height="50" fill="#111" opacity="0.3"/>
      <rect x="0" y="38" width="120" height="12" fill="#00a6a6"/>
      <text x="60" y="170" font-size="10" fill="#666" text-anchor="middle">Total: 475K</text>
    </g>
    
    <g transform="translate(720, 60)">
      <text x="0" y="-5" font-size="12" font-weight="600" fill="#111">Iberojet</text>
      <rect x="0" y="0" width="120" height="55" fill="#111" opacity="0.3"/>
      <rect x="0" y="40" width="120" height="15" fill="#00a6a6"/>
      <text x="60" y="170" font-size="10" fill="#666" text-anchor="middle">Total: 380K</text>
    </g>
    
    <g transform="translate(880, 60)">
      <text x="0" y="-5" font-size="12" font-weight="600" fill="#111">American Airlines</text>
      <rect x="0" y="0" width="120" height="100" fill="#111" opacity="0.3"/>
      <rect x="0" y="70" width="120" height="30" fill="#00a6a6"/>
      <text x="60" y="170" font-size="10" fill="#666" text-anchor="middle">Total: 920K</text>
    </g>
  </g>

  <!-- Fuel Ratio Trend -->
  <g font-family="Inter, sans-serif" transform="translate(60, 480)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#111">RATIO COMBUSTIBLE / TOTAL POR AÑO (%)</text>
    <rect x="0" y="20" width="1080" height="150" fill="none" stroke="#d9d9d4"/>
    
    <!-- Line chart representation -->
    <polyline fill="none" stroke="#00a6a6" stroke-width="3" points="0,130 180,110 360,95 540,85 720,90 900,95 1080,100"/>
    <polyline fill="none" stroke="#111" stroke-width="2" stroke-dasharray="5,5" points="0,140 180,125 360,115 540,105 720,110 900,115 1080,120"/>
    
    <text x="0" y="170" font-size="10" fill="#666">2001</text>
    <text x="180" y="170" font-size="10" fill="#666">2003</text>
    <text x="360" y="170" font-size="10" fill="#666">2005</text>
    <text x="540" y="170" font-size="10" fill="#666">2007</text>
    <text x="720" y="170" font-size="10" fill="#666">2009</text>
    <text x="900" y="170" font-size="10" fill="#666">2011</text>
    <text x="1080" y="170" font-size="10" fill="#666">2015</text>
    
    <!-- Legend -->
    <rect x="900" y="-15" width="18" height="18" rx="3" fill="#00a6a6"/>
    <text x="925" y="-2" font-size="11" fill="#111">Ratio Promedio</text>
    <rect x="1020" y="-15" width="18" height="18" rx="3" fill="#111" opacity="0.5"/>
    <text x="1045" y="-2" font-size="11" fill="#111">Iberia</text>
  </g>
</svg>