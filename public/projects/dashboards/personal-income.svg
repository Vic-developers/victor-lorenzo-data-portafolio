<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#f7f7f5"/>
  <text x="600" y="50" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#111" text-anchor="middle">DASHBOARD INGRESOS PERSONALES 2010–2022</text>
  
  <!-- KPI Cards -->
  <g font-family="Inter, sans-serif">
    <rect x="40" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="70" y="115" font-size="11" letter-spacing="1.2" fill="#666">AÑOS DE DATOS</text>
    <text x="70" y="155" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#00a6a6">13</text>
    
    <rect x="320" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="350" y="115" font-size="11" letter-spacing="1.2" fill="#666">CATEGORÍAS PRODUCTO</text>
    <text x="350" y="155" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#111">5</text>
    
    <rect x="600" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="630" y="115" font-size="11" letter-spacing="1.2" fill="#666">PUNTOS DE DATOS</text>
    <text x="630" y="155" font-family="Space Grotesk" font-size="36" font-weight="700" fill="#111">261</text>
    
    <rect x="880" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="910" y="115" font-size="11" letter-spacing="1.2" fill="#666">TOP PRODUCTO</text>
    <text x="910" y="155" font-family="Space Grotesk" font-size="22" font-weight="700" fill="#00a6a6">EVENTOS</text>
  </g>

  <!-- Revenue by Year Bar Chart -->
  <g font-family="Inter, sans-serif">
    <text x="60" y="230" font-size="14" font-weight="600" fill="#111">INGRESOS POR AÑO (MILES)</text>
    <g transform="translate(60, 250)">
      <rect x="0" y="0" width="540" height="200" fill="none" stroke="#d9d9d4"/>
      <text x="0" y="220" font-size="11" fill="#666">2010</text>
      <text x="67" y="220" font-size="11" fill="#666">2012</text>
      <text x="134" y="220" font-size="11" fill="#666">2014</text>
      <text x="201" y="220" font-size="11" fill="#666">2016</text>
      <text x="268" y="220" font-size="11" fill="#666">2018</text>
      <text x="335" y="220" font-size="11" fill="#666">2020</text>
      <text x="402" y="220" font-size="11" fill="#666">2022</text>
      
      <!-- Bars - simulated data -->
      <rect x="0" y="50" width="50" height="150" fill="#00a6a6" opacity="0.9"/>
      <rect x="67" y="40" width="50" height="160" fill="#00a6a6" opacity="0.9"/>
      <rect x="134" y="30" width="50" height="170" fill="#00a6a6" opacity="0.9"/>
      <rect x="201" y="25" width="50" height="175" fill="#00a6a6" opacity="0.9"/>
      <rect x="268" y="20" width="50" height="180" fill="#00a6a6" opacity="0.9"/>
      <rect x="335" y="15" width="50" height="185" fill="#00a6a6" opacity="0.9"/>
      <rect x="402" y="10" width="50" height="190" fill="#00a6a6" opacity="0.9"/>
    </g>

    <!-- Quarterly Seasonality -->
    <text x="680" y="230" font-size="14" font-weight="600" fill="#111">ESTACIONALIDAD TRIMESTRAL</text>
    <g transform="translate(680, 250)">
      <rect x="0" y="0" width="460" height="200" fill="none" stroke="#d9d9d4"/>
      <text x="0" y="220" font-size="11" fill="#666">Q1</text>
      <text x="115" y="220" font-size="11" fill="#666">Q2</text>
      <text x="230" y="220" font-size="11" fill="#666">Q3</text>
      <text x="345" y="220" font-size="11" fill="#666">Q4</text>
      
      <rect x="0" y="80" width="80" height="120" fill="#111" opacity="0.6"/>
      <rect x="115" y="60" width="80" height="140" fill="#111" opacity="0.6"/>
      <rect x="230" y="100" width="80" height="100" fill="#111" opacity="0.6"/>
      <rect x="345" y="20" width="80" height="180" fill="#00a6a6" opacity="0.9"/>
    </g>
  </g>

  <!-- Product Mix Stacked -->
  <g font-family="Inter, sans-serif" transform="translate(60, 480)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#111">MEZCA DE PRODUCTOS (% TOTAL)</text>
    <rect x="0" y="20" width="1080" height="40" rx="4" fill="#efefeb"/>
    <rect x="0" y="20" width="194" height="40" rx="4" fill="#00a6a6"/>
    <rect x="194" y="20" width="259" height="40" fill="#111"/>
    <rect x="453" y="20" width="173" height="40" fill="#666"/>
    <rect x="626" y="20" width="130" height="40" fill="#d9d9d4"/>
    <rect x="756" y="20" width="324" height="40" fill="#999"/>
    <text x="10" y="45" font-size="10" fill="#fff" font-weight="600">EVENTOS 18%</text>
    <text x="200" y="45" font-size="10" fill="#fff" font-weight="600">CURSOS 24%</text>
    <text x="460" y="45" font-size="10" fill="#fff" font-weight="600">ALQUILER 16%</text>
    <text x="630" y="45" font-size="10" fill="#111" font-weight="600">LIBROS 12%</text>
    <text x="760" y="45" font-size="10" fill="#111" font-weight="600">TRABAJO 30%</text>
  </g>
</svg>