<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <rect width="1200" height="675" fill="#f7f7f5"/>
  <text x="600" y="50" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#111" text-anchor="middle">DASHBOARD VENTAS SEGUROS — TEMA GOTITA</text>
  
  <!-- KPI Cards -->
  <g font-family="Inter, sans-serif">
    <rect x="40" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="70" y="115" font-size="11" letter-spacing="1.2" fill="#666">MUNICIPIO TOP</text>
    <text x="70" y="155" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#00a6a6">CENTRO</text>
    
    <rect x="320" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="350" y="115" font-size="11" letter-spacing="1.2" fill="#666">SEGURO LÍDER</text>
    <text x="350" y="155" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#111">SALUD</text>
    
    <rect x="600" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="630" y="115" font-size="11" letter-spacing="1.2" fill="#666">MEJOR AGENTE</text>
    <text x="630" y="155" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#111">ALEX</text>
    
    <rect x="880" y="80" width="260" height="100" rx="8" fill="#fff" stroke="#d9d9d4"/>
    <text x="910" y="115" font-size="11" letter-spacing="1.2" fill="#666">TOP TRANSACCIÓN</text>
    <text x="910" y="155" font-family="Space Grotesk" font-size="28" font-weight="700" fill="#00a6a6">$40.098</text>
  </g>

  <!-- Sales by Municipality -->
  <g font-family="Inter, sans-serif" transform="translate(60, 220)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#111">VENTAS POR MUNICIPIO</text>
    <rect x="0" y="20" width="520" height="200" fill="none" stroke="#d9d9d4"/>
    
    <!-- Bar chart horizontal -->
    <text x="0" y="70" font-size="12" fill="#111" text-anchor="end">Centro</text>
    <rect x="90" y="50" width="380" height="30" fill="#00a6a6"/>
    <text x="480" y="72" font-size="11" fill="#666">$152.718</text>
    
    <text x="0" y="110" font-size="12" fill="#111" text-anchor="end">Norte</text>
    <rect x="90" y="90" width="220" height="30" fill="#111" opacity="0.7"/>
    <text x="320" y="112" font-size="11" fill="#666">$88.450</text>
    
    <text x="0" y="150" font-size="12" fill="#111" text-anchor="end">Sur</text>
    <rect x="90" y="130" width="180" height="30" fill="#111" opacity="0.5"/>
    <text x="280" y="152" font-size="11" fill="#666">$72.100</text>
    
    <text x="0" y="190" font-size="12" fill="#111" text-anchor="end">Este</text>
    <rect x="90" y="170" width="120" height="30" fill="#111" opacity="0.3"/>
    <text x="220" y="192" font-size="11" fill="#666">$48.300</text>
  </g>

  <!-- Sales by Insurance Type -->
  <g font-family="Inter, sans-serif" transform="translate(620, 220)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#111">VENTAS POR TIPO SEGURO</text>
    
    <!-- Donut chart representation -->
    <circle cx="200" cy="120" r="80" fill="none" stroke="#efefeb" stroke-width="50"/>
    <path d="M200 40 A80 80 0 1 1 200 200" fill="none" stroke="#00a6a6" stroke-width="50" stroke-linecap="round" stroke-dasharray="300 502"/>
    <circle cx="200" cy="120" r="80" fill="none" stroke="#111" stroke-width="50" stroke-dasharray="150 502" transform="rotate(180 200 120)"/>
    <circle cx="200" cy="120" r="80" fill="none" stroke="#666" stroke-width="50" stroke-dasharray="52 502" transform="rotate(-90 200 120)"/>
    
    <text x="200" y="115" font-family="Space Grotesk" font-size="24" font-weight="700" fill="#111" text-anchor="middle">3</text>
    <text x="200" y="135" font-size="11" fill="#666" text-anchor="middle">TIPOS</text>
    
    <!-- Legend -->
    <rect x="20" y="240" width="18" height="18" rx="3" fill="#00a6a6"/>
    <text x="45" y="253" font-size="11" fill="#111">Salud (58%)</text>
    <rect x="20" y="265" width="18" height="18" rx="3" fill="#111"/>
    <text x="45" y="278" font-size="11" fill="#111">Vida (29%)</text>
    <rect x="20" y="290" width="18" height="18" rx="3" fill="#666"/>
    <text x="45" y="303" font-size="11" fill="#111">Hogar (13%)</text>
  </g>

  <!-- Agent Performance -->
  <g font-family="Inter, sans-serif" transform="translate(60, 450)">
    <text x="0" y="0" font-size="14" font-weight="600" fill="#111">RENDIMIENTO POR AGENTE</text>
    <rect x="0" y="20" width="520" height="140" fill="none" stroke="#d9d9d4"/>
    
    <text x="40" y="55" font-size="12" font-weight="600" fill="#111">Alex</text>
    <rect x="40" y="65" width="180" height="20" rx="3" fill="#00a6a6"/>
    <text x="230" y="80" font-size="11" fill="#666">Salud: $70.731</text>
    <rect x="40" y="95" width="120" height="20" rx="3" fill="#111" opacity="0.7"/>
    <text x="170" y="110" font-size="11" fill="#666">Vida: $6.909</text>
    <rect x="40" y="125" width="80" height="20" rx="3" fill="#666"/>
    <text x="130" y="140" font-size="11" fill="#666">Hogar: $12.948</text>
    
    <text x="320" y="55" font-size="12" font-weight="600" fill="#111">Carlos</text>
    <rect x="320" y="65" width="60" height="20" rx="3" fill="#00a6a6" opacity="0.5"/>
    <text x="390" y="80" font-size="11" fill="#666">Salud: $30.633</text>
    <rect x="320" y="95" width="90" height="20" rx="3" fill="#111" opacity="0.7"/>
    <text x="420" y="110" font-size="11" fill="#666">Vida: $15.420</text>
    <rect x="320" y="125" width="100" height="20" rx="3" fill="#666"/>
    <text x="430" y="140" font-size="11" fill="#666">Hogar: $22.180</text>
  </g>
</svg>